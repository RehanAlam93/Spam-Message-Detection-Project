<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam SMS Classifier</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 5px;
        }

        h2 {
            margin: 0 0 5px 0;
            color: #333;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            resize: none;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 22px;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spam {
            color: #c0392b;
            background: #fdecea;
        }

        .ham {
            color: #1e8449;
            background: #eafaf1;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✉️</div>
        <h2>Spam SMS Detection</h2>
        <p class="subtitle">Machine Learning based message classifier</p>

        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Wrire Your Message" required>{{ request.form.message if request.form.message else '' }}</textarea><br>
            <button type="submit">Check Message</button>
        </form>

        {% if prediction_text %}
            <div class="result {{ result_class }}">
                Result: {{ prediction_text }}
            </div>
        {% endif %}

        <footer>Built with Flask &amp; Machine Learning</footer>
    </div>

</body>
</html>
